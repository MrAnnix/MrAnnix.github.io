name: Deploy Jekyll Site

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment to deploy to'
      branch:
        required: true
        type: string
        description: 'Branch to deploy from'
      config_files:
        required: false
        type: string
        default: '_config.yml'
        description: 'Comma-separated list of config files'
      fail_on_html_errors:
        required: false
        type: boolean
        default: true
        description: 'Whether to fail build on HTMLProofer errors'
      deploy:
        required: false
        type: boolean
        default: true
        description: 'Whether to deploy to GitHub Pages'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment per environment
concurrency:
  # Only real deployments share a group; PR validations get one per ref so they don't cancel each other
  group: "pages-${{ inputs.environment }}-${{ inputs.deploy && 'deploy' || github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout ${{ inputs.branch }} branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '.ruby-version'
          bundler-cache: true

      - name: Verify platform compatibility
        run: |
          if ! bundle check &>/dev/null; then
            echo "Adding current platform to lockfile..."
            bundle lock --add-platform x86_64-linux
          fi

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Jekyll
        run: bundle exec jekyll build --config ${{ inputs.config_files }}
        env:
          JEKYLL_ENV: ${{ inputs.environment }}
          GITHUB_PAGES: true

      - name: Test site with HTMLProofer
        run: bundle exec htmlproofer ./_site --only-4xx --ignore-status-codes "403,429" --checks Images,Scripts,Links,Favicon,OpenGraph
        continue-on-error: ${{ !inputs.fail_on_html_errors }}

      - name: Show site structure
        run: tree _site
        continue-on-error: true

      - name: Check build size
        run: |
          echo "### Build Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build successful!** :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Site size:** $(du -sh _site | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "**Files:** $(find _site -type f | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Config:** ${{ inputs.config_files }}" >> $GITHUB_STEP_SUMMARY

      # _config.yml publishes .well-known/ (include: [".well-known"]); fail if it goes missing
      - name: Verify .well-known is in the build
        run: test -d _site/.well-known && ls -la _site/.well-known

      - name: Upload artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Since v4 dotfiles are excluded by default; .well-known/ must be published
          include-hidden-files: true

  deploy:
    if: inputs.deploy
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
