name: Deploy Production Site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

# One production deployment at a time; a queued one waits instead of cancelling a deploy in progress
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      environment: production
      config_files: '_config.yml'
      upload_artifact: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Minimum permissions for actions/deploy-pages
    permissions:
      pages: write
      id-token: write
    # Its branch rule only accepts master
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
