name: Validate Pull Request

on:
  pull_request:
    branches:
      - master

permissions: {}

# A new push to the pull request supersedes the previous validation
concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      environment: production
      config_files: '_config.yml'
