# Site settings
title: "Raul San Martin"
SEOtitle: "Raul San Martin · Data Engineer"
description: "I’m a Data Engineer and Machine Learning enthusiast living in Spain."
url: "https://raulsanmartin.me"
baseurl: ""
lang: en
favicon: "/assets/images/favicon.png"
logo: "/assets/images/logo.png"
name_img: "/assets/images/RaulSanMartin.png"
author: "Raúl San Martín Aniceto"
permalink: /:categories/:title/
theme: null # Stops the github-pages gem from falling back to jekyll-theme-primer
timezone: Europe/Madrid
include: [".well-known"] # Jekyll skips dot-folders; this one serves dat:// discovery and OpenPGP WKD
# Repo-only files. A custom list replaces the defaults of Jekyll 3 and the github-pages gem,
# so the entries from Gemfile to CNAME repeat them
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - CNAME
  - AGENTS.md
  - README.md
  - netlify.toml

# Top bar
topbar: "<b>Raul San Martin</b> / MrAnnix"

# Liquid
liquid:
  error_mode: strict

# Markdown
markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-sitemap

# Sass
sass:
  sass_dir: _sass
  style: compressed
  add_charset: true

# Categories and tags pages
tag_page: '/tags/'
category_page: '/categories/'

# Addons
google-site-verification: "4KpPIPbUzRNI1DJR-OrOS5tNYrNvTIMj2Xh9bIybdPE"

# Shown on the contact page; obfuscated on purpose
email: hello@[this domain]

# Home page links. `title` picks the icon: it must match a `.sites-list li.<title>` rule in _sass/_index.scss
social:
  - title: e-mail
    description: '<span class="email-address">hello@[this domain]</span> for e-mail'
    link: "/contact"
    alt: "Contact page"
  - title: github
    description: "MrAnnix on GitHub"
    link: "https://github.com/MrAnnix"
    alt: "MrAnnix's GitHub profile"
  - title: linkedin
    description: "Raul San Martin on Linkedin"
    link: "https://www.linkedin.com/in/raul-san-martin-aniceto"
    alt: "MrAnnix's Linkedin profile"
